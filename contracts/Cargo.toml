[workspace]
resolver = "2"
members = ["escrow"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/StellarOpenInfrastructure/stellar-escrow"
rust-version = "1.84"

[workspace.dependencies]
soroban-sdk = "29.0.1"

# Soroban contracts must be small and deterministic.
[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
